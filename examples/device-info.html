<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>tauri-webusb device info</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
  button { font: inherit; padding: 8px 16px; margin-right: 8px; }
  .device { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
  .protected { color: #b45309; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  td, th { text-align: left; padding: 2px 8px 2px 0; font-size: 13px; }
  .empty { color: #666; }
</style>
</head>
<body>
  <h1>tauri-webusb device info</h1>
  <button id="refresh">Refresh granted devices</button>
  <button id="request">Grant a new device…</button>
  <div id="devices"><p class="empty">Click "Refresh" to list devices this page currently has access to.</p></div>

<script>
function hex(n, width) { return "0x" + n.toString(16).padStart(width, "0"); }

function renderDevice(d) {
  const div = document.createElement("div");
  div.className = "device";
  const title = document.createElement("h3");
  title.textContent = d.productName || `${hex(d.vendorId, 4)}:${hex(d.productId, 4)}`;
  div.appendChild(title);

  const meta = document.createElement("div");
  meta.textContent = [
    `${hex(d.vendorId, 4)}:${hex(d.productId, 4)}`,
    d.manufacturerName,
    d.serialNumber ? `S/N ${d.serialNumber}` : null,
    `USB ${d.usbVersionMajor}.${d.usbVersionMinor}.${d.usbVersionSubminor}`,
  ].filter(Boolean).join(" · ");
  div.appendChild(meta);

  for (const cfg of d.configurations) {
    const cfgHeader = document.createElement("p");
    cfgHeader.innerHTML = `<strong>Configuration ${cfg.configurationValue}</strong>${cfg.configurationName ? " — " + cfg.configurationName : ""}`;
    div.appendChild(cfgHeader);

    const table = document.createElement("table");
    table.innerHTML = "<tr><th>Interface</th><th>Alt</th><th>Class</th><th>Endpoints</th></tr>";
    for (const iface of cfg.interfaces) {
      for (const alt of iface.alternates) {
        const row = document.createElement("tr");
        const endpoints = alt.endpoints.map(e => `EP${e.endpointNumber} ${e.direction} ${e.type} (${e.packetSize}B)`).join(", ") || "—";
        row.innerHTML = `
          <td>${iface.interfaceNumber}</td>
          <td>${alt.alternateSetting}</td>
          <td class="${alt.interfaceProtected ? "protected" : ""}">${hex(alt.interfaceClass, 2)}${alt.interfaceProtected ? " (protected)" : ""}</td>
          <td>${endpoints}</td>
        `;
        table.appendChild(row);
      }
    }
    div.appendChild(table);
  }
  return div;
}

async function refresh() {
  const container = document.getElementById("devices");
  container.innerHTML = "";
  try {
    const devices = await navigator.usb.getDevices();
    if (devices.length === 0) {
      container.innerHTML = '<p class="empty">No devices granted to this origin yet — click "Grant a new device…".</p>';
      return;
    }
    devices.forEach(d => container.appendChild(renderDevice(d)));
  } catch (err) {
    container.innerHTML = `<p class="protected">${err.name}: ${err.message}</p>`;
  }
}

document.getElementById("refresh").addEventListener("click", refresh);
document.getElementById("request").addEventListener("click", async () => {
  try {
    await navigator.usb.requestDevice({ filters: [{}] });
    await refresh();
  } catch (err) {
    document.getElementById("devices").innerHTML = `<p class="protected">${err.name}: ${err.message}</p>`;
  }
});

navigator.usb?.addEventListener?.("connect", refresh);
navigator.usb?.addEventListener?.("disconnect", refresh);
</script>
</body>
</html>
